[mypy]
python_version = 3.13
# MEASURED 26 Aug 2026: the shared pyenv site-packages editable install of `consilient`
# points at whichever unit's worktree last ran `pip install -e .` (one shared install
# location, no per-worktree venv) -- so a bare `mypy --config-file mypy.ini <files>`
# resolves `import consilient` against THAT unit's code, not this worktree's own
# src/consilient. This makes mypy_path win over site-packages for this worktree.
mypy_path = src
strict = True
check_untyped_defs = True
strict_optional = True
no_implicit_optional = True
warn_unreachable = True
warn_redundant_casts = True
warn_unused_ignores = True

[mypy-pytest.*]
ignore_missing_imports = True
