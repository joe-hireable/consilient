# Adopted collector boundary: OpenTelemetry Collector v0.159.0, Apache-2.0.
# Retrieved 2026-08-21 from the official release and configuration contracts:
# https://github.com/open-telemetry/opentelemetry-collector-releases/releases/tag/v0.159.0
# https://opentelemetry.io/docs/languages/js/exporters/#collector-setup
# Run with: otelcol --config config/otel-collector-errors.yaml
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    logs/errors:
      receivers: [otlp]
      exporters: [debug]
