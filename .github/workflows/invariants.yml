name: v0 invariants
# Every invariant the observe-only increment declares ships with its check (I1).
# Gate A condition 2 requires the replay invariant to hold in CI specifically.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest mypy ruff
      - name: Static checks
        # Added after mypy found a reachable crash in beta.render() that 24 passing tests
        # missed. A stronger check is a lower beta; this is the ratchet applied to us.
        run: python -m mypy --strict src/consilient
      - name: Repository-wide Ruff
        run: python -m ruff check .
      - name: Invariant checks
        run: python -m pytest tests -q
      - name: Replay invariant on the real trajectory
        # Build the projection first so that `replay` has a subject to compare against.
        # Before 20 Aug 2026 this step ran `replay` on a fresh checkout with no state on
        # disk, and `replay` compared two rebuilds from the same log — identical by
        # construction. Gate A condition 2 was recorded as satisfied on a check that could
        # not fail. `compared` must now be true, or the run failed to test anything.
        run: |
          PYTHONPATH=src python -m consilient.cli --json beta > beta.json
          PYTHONPATH=src python -m consilient.cli --json replay > replay.json
          cat replay.json
          python -c "import json,sys; r=json.load(open('replay.json')); sys.exit(0 if r['compared'] and r['identical'] else 1)"
