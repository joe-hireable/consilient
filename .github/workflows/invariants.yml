name: v0 invariants
# Every invariant the observe-only increment declares ships with its check (I1).
# Gate A condition 2 requires the replay invariant to hold in CI specifically.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The foreign-identifier step asks git whether a 40-hex string resolves in
          # this repository. The default shallow clone would report our own history
          # as foreign. fetch-depth 0 is the check being able to see its subject.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest mypy ruff
      - name: Static checks
        # Added after mypy found a reachable crash in beta.render() that 24 passing tests
        # missed. A stronger check is a lower beta; this is the ratchet applied to us.
        run: python -m mypy --strict src/consilient
      - name: Invariant checks
        run: python -m pytest tests -q
      - name: Rename safety invariant check
        run: python .github/scripts/check_rename_safety.py --check
      - name: Spend escalation invariant check
        # V0-39 / ADR-0056 D5. On-Demand Spending is the one control that spends real money and
        # only the principal may change it. Ships before EXP-94, which must call the same Cursor
        # service read-only -- the spend-escalation methods sit on it.
        run: python .github/scripts/check_no_spend_escalation.py --check
      - name: Design token contract invariant check
        # ADR-0060 / using-open-design. Asserts that all governed UI/CSS files
        # strictly adhere to the declared DESIGN.md color palette without undeclared inventions.
        run: python .github/scripts/check_design_tokens.py --check
      - name: Foreign identifier invariant check
        # A path-matcher cannot see a commit identifier. `check_foreign_identifiers.py` was
        # written on 21 Aug 2026 after an audit found 71 forty-character SHAs from a private
        # commercial repository in a tracked results file, and it then had no CI step at all —
        # so the tracked tree was only ever scanned when someone remembered to. `--self-test`
        # is additive here, not instead-of: the script proves its detector still detects and
        # then scans. `check_private_corpus.py` deliberately does NOT get a step: its own
        # docstring says it cannot run on a runner, and a gate that silently no-ops is worse
        # than no gate. That omission is pinned by a test.
        run: python .github/scripts/check_foreign_identifiers.py --self-test
      - name: Replay invariant on a committed fixture trajectory, with a drift control
        # Until 21 Aug 2026 this step ran `beta` first, "so that `replay` has a subject to
        # compare against", then required `compared && identical`. The subject `beta` leaves
        # behind is itself a rebuild from the same log — `cmd_beta` calls `projection.build`,
        # which unlinks the database — so `identical: true` was guaranteed. That is A1, the
        # two-rebuild comparison this step was written to replace, moved one invocation
        # further out. A fresh checkout never carries `.harness/state.db`; it is gitignored,
        # so in CI there has never been an independent subject to compare against.
        #
        # It also read `.harness/log`, which ADR-0057 gitignored because a user's trajectory
        # is their data. On a fresh checkout that directory is empty, so the first assertion
        # aborted the step before it could prove anything. The subject is now a committed
        # synthetic fixture — one schema-v1 event, no user data — and the database is
        # runner-local, so the step never touches a user's trajectory or state.
        #
        # What CI can honestly test is that the detector works. The control below drifts the
        # state out of band and REQUIRES the check to see it; then it requires a clean
        # rebuild over a non-empty trajectory to compare identical. Both assertions can fail.
        run: |
          python - <<'PY'
          import argparse, os, sqlite3, sys, tempfile
          sys.path.insert(0, "src")
          from consilient.cli import cmd_replay

          db = os.path.join(os.environ.get("RUNNER_TEMP") or tempfile.gettempdir(), "replay-ci.db")
          args = argparse.Namespace(log="tests/fixtures/replay-ci", db=db)

          seed = cmd_replay(args)
          assert seed["events"] > 0, "no trajectory to replay; the control would be vacuous"

          conn = sqlite3.connect(args.db)
          conn.execute("UPDATE events SET actor = 'ci-drift-control' WHERE position = 0")
          conn.commit()
          assert conn.total_changes == 1, "the control changed no row; it proves nothing"
          conn.close()

          drifted = cmd_replay(args)
          assert drifted["compared"] and drifted["identical"] is False, (
              f"the replay check did not see deliberate out-of-band drift: {drifted}"
          )

          clean = cmd_replay(args)
          assert clean["compared"] and clean["identical"] is True and clean["events"] > 0, (
              f"a clean rebuild over a non-empty trajectory did not compare identical: {clean}"
          )
          print(f"drift control OK over {clean['events']} events")
          PY
      - name: Repository-wide Ruff
        # Runs at end of workflow with continue-on-error until pre-existing Ruff violations in tests/experiments are resolved
        continue-on-error: true
        run: python -m ruff check .
