name: Secret scan
# Invariant AGENTS/Boundaries: credentials and .env files never enter tracked history.
# The dependency-free check and this workflow ship with the clarified rule (I1).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject credential-shaped tracked content
        run: python .github/scripts/check_secrets.py --history --self-test
