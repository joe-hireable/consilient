name: skills-mirror
# ADR-0014: .agents/ is the source of truth. The Claude skills mirror is normally
# a symlink, with an exact-copy fallback for Windows clones that cannot create one.
# The checker accepts either representation and rejects content or tree drift.
#
# .claude/agents remains symlink-only; its existing assertions stay separate.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .claude mirrors resolve into .agents without drift
        run: |
          python scripts/sync_skills.py --check
          test -L .claude/agents
          test -f .claude/agents/consilient-worker.md
          [ "$(readlink .claude/agents)" = "../.agents/agents" ]
